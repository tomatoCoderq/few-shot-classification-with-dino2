[project]
name = "project"
version = "0.1.0"
description = "Few-shot pet breed classification with frozen DINOv2 and ResNet-50"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy==2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[project.optional-dependencies]
demo = [
    "gradio>=6,<7",
]
